<!DOCTYPE html>
<html>
<head>
    <title>Mullin Picks</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            text-align: center;
            padding: 40px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 42px;
        }

        header p {
            font-size: 18px;
        }

        .products {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            display: grid;
            gap: 20px;
        }

        .product {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .product h2 {
            margin-top: 0;
        }

        .button {
            display: inline-block;
            padding: 12px 20px;
            background: #111;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #666;
        }
    </style>
</head>

<body>

<header>
    <h1>Mullin Picks</h1>
    <p>Smart finds without the hassle</p>
</header>

<div class="products">

    <div class="product">
        <h2>💻 Computer & Tech Finds</h2>
        <p>Useful computer accessories and gadgets worth checking out.</p>
        <a class="button" href="#">Check Product</a>
    </div>

    <div class="product">
        <h2>Product #2</h2>
        <p>Another product worth checking out.</p>
        <a class="button" href="#">Check Product</a>
    </div>

    <div class="product">
        <h2>Product #3</h2>
        <p>Another useful recommendation.</p>
        <a class="button" href="#">Check Product</a>
    </div>

</div>

<footer>
    <p>© 2026 Mullin Picks</p>
</footer>

</body>
</html>
